<div class="container mt-5">
    <div class="header d-flex justify-content-between align-items-center mb-4">
        <h1>Products</h1>
        <button class="btn btn-warning">
            🛒 Cart ({{ cartCount$ | async }})
        </button>
    </div>

    <div class="filter-section mb-4">
        <select class="form-select" [(ngModel)]="selectedCategory" (change)="onCategoryChange()">
            <option value="">All Products ({{ totalCount }})</option>
            @for (cat of categories; track cat) {
            <option [value]="cat">{{ cat }}</option>
            }
        </select>
    </div>

    <div class="row">
        @for (product of products; track product.id) {
        <div class="col-md-3 mb-4">
            <div class="card h-100">
                <img [src]="product.image" class="card-img-top" [alt]="product.name"
                    style="height: 200px; object-fit: cover;">

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ product.name }}</h5>

                    <p class="card-text text-primary fs-5">${{ product.price }}</p>

                    <p class="text-muted small">
                        @if (product.stock > 0) {
                        In Stock: {{ product.stock }}
                        } @else {
                        Out of Stock
                        }
                    </p>

                    <button class="btn btn-primary w-100 mt-auto" [disabled]="product.stock <= 0"
                        (click)="addToCart(product)">
                        @if (product.stock > 0) {
                        Add to Cart
                        } @else {
                        Out of Stock
                        }
                    </button>
                </div>
            </div>
        </div>
        }
    </div>
</div>
