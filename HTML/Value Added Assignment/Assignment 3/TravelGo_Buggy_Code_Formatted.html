<!-- BUGGY HTML CODE - TRAVELGO HOLIDAY PACKAGES PORTAL -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelGo - Holiday Packages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="banner">
    <h1>Explore The World</h1>
    <button>Book Now</button>
</section>

<section class="packages">
    <div class="package featured">
        <img src="paris.jpg">
        <h3>Paris Tour</h3>
        <p>5 Days</p>
        <p>59999</p>
        <button>Book</button>
    </div>

    <div class="package">
        <img src="switzerland.jpg">
        <h3>Switzerland Tour</h3>
        <p>7 Days</p>
        <p>79999</p>
        <button>Book</button>
    </div>
</section>

<section class="contact">
    <form>
        <input type="text" placeholder="Name">
        <input type="email" placeholder="Email">
        <button>Submit</button>
    </form>
</section>

<footer>
    <p>TravelGo</p>
</footer>

</body>
</html>
